name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + msbuild + nuget are pre-installed.
    # (Mono was dropped from ubuntu-24.04 and has no apt package there.)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Resolve version from the tag (strips leading "v") ──────────────────
      - name: Set version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.9.0
          VERSION="${TAG#v}"                # e.g. 0.9.0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # ── Restore / download NuGet packages that carry game DLLs ─────────────
      - name: Restore NuGet packages
        run: |
          # Restore the packages listed in packages.config into the packages/ folder
          # using nuget CLI (shipped with mono-complete)
          nuget restore DrakeRenameit.csproj -PackagesDirectory packages

      # ── Stage the game / BepInEx DLLs that the csproj HintPaths expect ──────
      #
      #  The csproj uses three path variables:
      #    BepInExPath              → BepInEx core DLLs (0Harmony, BepInEx)
      #    CorlibPath               → UnityEngine modules + Unity.TextMeshPro
      #    PublicizedAssembliesPath → assembly_valheim_publicized, etc.
      #
      #  Pfhoenix.Valheim.ModProjectReferences ships the real (non-publicized)
      #  game DLLs. Because the csproj only needs them to resolve types at
      #  compile time (not to access private members — those go through
      #  AccessTools reflection), we alias them under the _publicized names.
      # ────────────────────────────────────────────────────────────────────────
      - name: Stage game DLLs from Pfhoenix package
        run: |
          # Find the extracted Pfhoenix package; nuget restore puts it under
          # packages/Pfhoenix.Valheim.ModProjectReferences.*/
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found after restore" >&2
            ls packages/ >&2
            exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          # Directories that BepInExPath and CorlibPath will point to
          mkdir -p ci_deps/bepinex/core ci_deps/corlib ci_deps/publicized

          # BepInEx core: 0Harmony + BepInEx (Pfhoenix ships them as lowercase)
          cp "$PFHOENIX_LIB/0Harmony.dll"  ci_deps/bepinex/core/
          cp "$PFHOENIX_LIB/bepinex.dll"   ci_deps/bepinex/core/BepInEx.dll

          # UnityEngine modules (CorlibPath)
          for dll in \
              UnityEngine.CoreModule.dll \
              UnityEngine.ImageConversionModule.dll \
              UnityEngine.IMGUIModule.dll \
              UnityEngine.InputLegacyModule.dll \
              UnityEngine.AnimationModule.dll \
              UnityEngine.JSONSerializeModule.dll \
              Unity.TextMeshPro.dll; do
            cp "$PFHOENIX_LIB/$dll" ci_deps/corlib/
          done

          # Publicized assemblies (csproj expects *_publicized.dll names)
          cp "$PFHOENIX_LIB/assembly_valheim.dll"  ci_deps/publicized/assembly_valheim_publicized.dll
          cp "$PFHOENIX_LIB/assembly_utils.dll"    ci_deps/publicized/assembly_utils_publicized.dll
          cp "$PFHOENIX_LIB/gui_framework.dll"     ci_deps/publicized/gui_framework_publicized.dll

      # ── Build (Release) ─────────────────────────────────────────────────────
      - name: Build
        run: |
          # Explicitly target only Build and ILRepacker — this skips CopyOutput
          # (writes to a local Windows r2modman path) and PackageMod (calls
          # PowerShell Compress-Archive). The zip is assembled in the next step.
          msbuild DrakeRenameit.csproj \
            /p:Configuration=Release \
            /p:BepInExPath="$(pwd)/ci_deps/bepinex" \
            /p:CorlibPath="$(pwd)/ci_deps/corlib" \
            /p:PublicizedAssembliesPath="$(pwd)/ci_deps/publicized" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /p:TargetFrameworkVersion=v4.8 \
            /t:"Build;ILRepacker" \
            /v:minimal

      # ── Assemble Thunderstore zip (mirrors PackageMod target) ────────────────
      #
      #  PackageMod copies into $(ThunderstoreFolder):
      #    DrakesRenameit.dll  (merged by ILRepack)
      #    README.md
      #    icon.png
      #    CHANGELOG.md
      #    manifest.json       (generated from the ManifestJson ItemGroup)
      #
      #  The manifest.json shape (from the csproj ItemGroup):
      #  {
      #    "name": "DrakesRenameit",
      #    "version_number": "0.9.0",
      #    "author": "DrakeMods",
      #    "description": "...",
      #    "website_url": "https://github.com/drakethos/DrakesRenameIt",
      #    "dependencies": [ "denikson-BepInExPack_Valheim-5.4.2333", "ValheimModding-Jotunn-2.27.1" ]
      #  }
      # ────────────────────────────────────────────────────────────────────────
      - name: Assemble Thunderstore package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakesRenameit-${VERSION}"
          ZIP_NAME="DrakeMods-DrakesRenameit-${VERSION}.zip"

          mkdir -p "$PKG_DIR"

          # The merged DLL ends up in bin/Release/ after ILRepack runs
          cp bin/Release/DrakesRenameit.dll "$PKG_DIR/"
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"

          # Generate manifest.json (same fields as the csproj ManifestJson item)
          python3 - <<'PYEOF'
          import json, os
          manifest = {
              "name": "DrakesRenameit",
              "version_number": os.environ["VERSION"],
              "author": "DrakeMods",
              "description": "Rename and change description any item in your inventory. You can even recolor them too! This is an early beta there may be bugs!",
              "website_url": "https://github.com/drakethos/DrakesRenameIt",
              "dependencies": [
                  "denikson-BepInExPack_Valheim-5.4.2333",
                  "ValheimModding-Jotunn-2.27.1"
              ]
          }
          pkg_dir = os.environ["PKG_DIR"]
          with open(f"{pkg_dir}/manifest.json", "w") as f:
              json.dump(manifest, f, indent=4)
          print("manifest.json written")
          PYEOF

          cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Thunderstore zip: $ZIP_NAME"
          ls -lh "$ZIP_NAME"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PKG_DIR: DrakeMods-DrakesRenameit-${{ steps.ver.outputs.version }}

      # ── Create GitHub Release and attach the zip ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesRenameIt ${{ steps.ver.outputs.version }}"
          prerelease: true
          body: |
            ## DrakesRenameIt v${{ steps.ver.outputs.version }}

            Pre-release build for testing before Thunderstore publish.

            ### Install
            Drop the zip into **r2modman** or **Thunderstore Mod Manager** via the "Import local mod" button, or manually extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesRenameit/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}
