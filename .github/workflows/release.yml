name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + nuget are pre-installed.
    # dotnet SDK added via setup-dotnet for Roslyn (C#10).
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      zip: ${{ steps.pkg.outputs.zip }}
      description: ${{ steps.pkg.outputs.description }}
      website_url: ${{ steps.pkg.outputs.website_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Version from mod.package.props (must match release tag v{Version}) ───
      #  Stable:  v1.2.0        → Thunderstore + Hexium + GitHub release
      #  Beta:    v1.2.0-beta.1 → Hexium + GitHub prerelease only (skip Thunderstore)
      #  Hexium accepts -beta.X in version_number; Thunderstore/tcli do not.
      - name: Resolve release version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE=false
            CHANNEL=stable
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            IS_PRERELEASE=true
            CHANNEL=beta
          else
            echo "::error::Tag ${TAG} must be vX.Y.Z (stable) or vX.Y.Z-beta.N (Hexium-only beta)." >&2
            exit 1
          fi

          PKG_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' mod.package.props | head -1 | xargs)
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read <Version> from mod.package.props" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} (${TAG_VERSION}) does not match mod.package.props (${PKG_VERSION}). Tag v${PKG_VERSION} or update <Version>." >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version: $PKG_VERSION (${CHANNEL}; mod.package.props)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: |
          nuget restore DrakeRenameit.csproj -PackagesDirectory packages

      - name: Fetch DrakeModsLibs reference DLL
        run: |
          LIBS_DEP=$(grep -oE 'DrakeMods-DrakeModsLibs-[0-9]+\.[0-9]+\.[0-9]+' mod.package.props | head -1)
          LIBS_VER="${LIBS_DEP#DrakeMods-DrakeModsLibs-}"
          if [ -z "$LIBS_VER" ]; then
            echo "::error::Could not parse DrakeMods-DrakeModsLibs version from mod.package.props" >&2
            exit 1
          fi
          echo "Downloading DrakeModsLibs $LIBS_VER for compile reference"
          curl -fsSL "https://thunderstore.io/package/download/DrakeMods/DrakeModsLibs/${LIBS_VER}/" -o /tmp/drakemodslibs.zip
          mkdir -p ci_libs /tmp/drakemodslibs
          unzip -qo /tmp/drakemodslibs.zip -d /tmp/drakemodslibs
          DLL=$(find /tmp/drakemodslibs -name 'DrakeModsLibs.dll' | head -1)
          if [ -z "$DLL" ]; then
            echo "::error::DrakeModsLibs.dll missing from Thunderstore zip" >&2
            find /tmp/drakemodslibs -type f >&2
            exit 1
          fi
          cp "$DLL" ci_libs/DrakeModsLibs.dll
          echo "WORKSHOP_LIBS_DLL=$(pwd)/ci_libs/DrakeModsLibs.dll" >> "$GITHUB_ENV"

      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found" >&2; ls packages/ >&2; exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"

          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"

          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"

          for src in assembly_googleanalytics assembly_guiutils assembly_lux \
                     assembly_postprocessing assembly_simplemeshcombine \
                     assembly_sunshafts SoftReferenceableAssets; do
            [ -f "$PFHOENIX_LIB/$src.dll" ] && \
              cp "$PFHOENIX_LIB/$src.dll" "$PUBLICIZED/${src}_publicized.dll" || true
          done

          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"

          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"

      - name: Build
        env:
          CI_NET48_FWPATH: ${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3/build
          CI_SKIP_POST_BUILD: "true"
        run: |
          CI_ROOT="$(pwd)/ci_valheim"
          MANAGED="$CI_ROOT/valheim_Data/Managed"
          dotnet msbuild DrakeRenameit.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$MANAGED" \
            /p:PublicizedAssembliesPath="$MANAGED/publicized_assemblies" \
            /p:WorkshopLibsDll="${WORKSHOP_LIBS_DLL}" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /t:Build \
            /v:minimal

      - name: Assemble Thunderstore package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakesRenameit-${VERSION}"
          ZIP_NAME="DrakeMods-DrakesRenameit-${VERSION}.zip"

          mkdir -p "$PKG_DIR/Assets/Localization" "$PKG_DIR/Assets/Icons" "$PKG_DIR/Assets/Items"
          cp bin/Release/DrakesRenameit.dll "$PKG_DIR/"
          cp Assets/Localization/*.json "$PKG_DIR/Assets/Localization/"
          if compgen -G "Assets/Icons/*.png" > /dev/null; then
            cp Assets/Icons/*.png "$PKG_DIR/Assets/Icons/"
          fi
          if [ -d Assets/Items ]; then
            # Copy forge assets, but never nested icon.png — Gale flattens zips and that
            # leaf name overwrites the Thunderstore package icon.png (must stay 256x256).
            # Prefer forge_icon.png in the repo; rename any leftover icon.png on the way in.
            (cd Assets/Items && find . -type f ! -name 'icon.png' -print0) | while IFS= read -r -d '' f; do
              mkdir -p "$PKG_DIR/Assets/Items/$(dirname "$f")"
              cp -a "Assets/Items/$f" "$PKG_DIR/Assets/Items/$f"
            done
            while IFS= read -r -d '' f; do
              dest="$PKG_DIR/Assets/Items/$(dirname "$f")/forge_icon.png"
              mkdir -p "$(dirname "$dest")"
              if [ ! -f "$dest" ]; then
                cp -a "Assets/Items/$f" "$dest"
                echo "Packaged nested icon.png as forge_icon.png: $f"
              else
                echo "Skipped nested icon.png (forge_icon.png already present): $f"
              fi
            done < <(cd Assets/Items && find . -type f -name 'icon.png' -print0)
          fi
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"

          dotnet msbuild DrakeRenameit.csproj \
            /p:Version="$VERSION" \
            /p:ThunderstoreManifestDir="$PKG_DIR" \
            /t:WriteThunderstoreManifest \
            /v:minimal

          DESCRIPTION=$(jq -r '.description' "$PKG_DIR/manifest.json")
          WEBSITE_URL=$(jq -r '.website_url // empty' "$PKG_DIR/manifest.json")

          cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "website_url=$WEBSITE_URL" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME"

      - name: Create GitHub Release (stable)
        if: steps.ver.outputs.is_prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesRenameIt ${{ steps.ver.outputs.version }}"
          prerelease: false
          body: |
            ## DrakesRenameIt v${{ steps.ver.outputs.version }}

            Thunderstore zip attached. CI also publishes to **Thunderstore** then **Hexium**.

            ### Install
            Drop the zip into **r2modman**, **Thunderstore Mod Manager**, or **Gale** via "Import local mod", or extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesRenameit/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}

      - name: Create GitHub Release (beta)
        if: steps.ver.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesRenameIt ${{ steps.ver.outputs.version }} (beta)"
          prerelease: true
          body: |
            ## DrakesRenameIt v${{ steps.ver.outputs.version }} (beta)

            **Beta / prerelease.** Zip attached. CI publishes to **Hexium only** with version `${{ steps.ver.outputs.version }}` (Thunderstore skipped; Hexium accepts `-beta.N`).

            ### Install
            Drop the zip into **r2modman**, **Thunderstore Mod Manager**, or **Gale** via "Import local mod", or extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesRenameit/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}

      - name: Upload Thunderstore zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-zip
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  publish-thunderstore:
    needs: build-and-release
    if: needs.build-and-release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Thunderstore zip
        uses: actions/download-artifact@v4
        with:
          name: thunderstore-zip
          path: dist

      - name: Publish package to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          namespace: DrakeMods
          name: DrakesRenameit
          version: ${{ needs.build-and-release.outputs.version }}
          description: ${{ needs.build-and-release.outputs.description }}
          community: valheim
          repo: https://thunderstore.io/c/valheim/
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          file: ${{ needs.build-and-release.outputs.zip }}
          path: dist
          website: ${{ needs.build-and-release.outputs.website_url }}
          categories: |
            misc

  publish-hexium:
    needs: [build-and-release, publish-thunderstore]
    # Run after a successful build even when Thunderstore was skipped (beta tags).
    # Uses publish-hexium.py (not tcli) so Hexium can receive -beta.X versions.
    if: |
      always()
      && needs.build-and-release.result == 'success'
      && (needs.publish-thunderstore.result == 'success'
          || needs.publish-thunderstore.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publish script
        uses: actions/checkout@v4

      - name: Download Thunderstore zip
        uses: actions/download-artifact@v4
        with:
          name: thunderstore-zip
          path: dist

      - name: Publish package to Hexium
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          ZIP_NAME: ${{ needs.build-and-release.outputs.zip }}
        run: |
          set -euo pipefail
          if [ -z "${HEXIUM_TOKEN}" ]; then
            echo "::error::HEXIUM_TOKEN secret is not set" >&2
            exit 1
          fi
          python3 .github/scripts/publish-hexium.py \
            --file "dist/${ZIP_NAME}" \
            --repository "https://valheim.hexium.gg" \
            --namespace "DrakeMods" \
            --communities "valheim" \
            --categories "Quality of Life,Valheim 1.0"
