name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + msbuild + nuget are pre-installed.
    # (Mono was dropped from ubuntu-24.04 and has no apt package there.)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Resolve version from the tag (strips leading "v") ──────────────────
      - name: Set version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.9.0
          VERSION="${TAG#v}"                # e.g. 0.9.0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # ── Restore / download NuGet packages that carry game DLLs ─────────────
      - name: Restore NuGet packages
        run: |
          # Restore the packages listed in packages.config into the packages/ folder
          # using nuget CLI (shipped with mono-complete)
          nuget restore DrakeRenameit.csproj -PackagesDirectory packages

      # ── Stage game DLLs from Pfhoenix package ──────────────────────────────
      #
      #  We build a fake "Valheim install" tree from the Pfhoenix NuGet package
      #  so that ALL reference paths resolve correctly from a single root:
      #
      #    ci_valheim/
      #      valheim_Data/Managed/          ← CorlibPath  (Unity modules, etc.)
      #        publicized_assemblies/       ← PublicizedAssembliesPath
      #      BepInEx/core/                  ← BepInExPath
      #
      #  Setting VALHEIM_INSTALL=ci_valheim also satisfies JotunnLib's
      #  JotunnLibRefsCorlib.props, which hard-codes:
      #    $(VALHEIM_INSTALL)\valheim_Data\Managed\publicized_assemblies\*_publicized
      #    $(VALHEIM_INSTALL)\valheim_Data\Managed\UnityEngine.*
      #  (On Linux, backslash path separators work in msbuild HintPaths too.)
      # ────────────────────────────────────────────────────────────────────────
      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found" >&2; ls packages/ >&2; exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"

          # Copy every DLL from Pfhoenix into Managed (satisfies CorlibPath and
          # the JotunnLib corlib props that reference $(VALHEIM_INSTALL)\...\Managed\*)
          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"

          # Publicized aliases (csproj HintPaths expect *_publicized.dll names)
          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"

          # Also copy any other assembly_* / SoftReferenceableAssets that
          # JotunnLibRefsCorlib.props may reference as *_publicized
          for src in "$PFHOENIX_LIB/assembly_googleanalytics.dll" \
                     "$PFHOENIX_LIB/assembly_guiutils.dll" \
                     "$PFHOENIX_LIB/assembly_lux.dll" \
                     "$PFHOENIX_LIB/assembly_postprocessing.dll" \
                     "$PFHOENIX_LIB/assembly_simplemeshcombine.dll" \
                     "$PFHOENIX_LIB/assembly_sunshafts.dll" \
                     "$PFHOENIX_LIB/SoftReferenceableAssets.dll"; do
            base=$(basename "$src" .dll)
            cp "$src" "$PUBLICIZED/${base}_publicized.dll" 2>/dev/null || true
          done

          # BepInEx core (csproj uses $(BepInExPath)\core\BepInEx.dll etc.)
          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"

          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"
          echo "BEPINEX_PATH=$(pwd)/ci_valheim/BepInEx" >> "$GITHUB_ENV"

      # ── Build (Release) ─────────────────────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: |
          # dotnet msbuild (Roslyn from .NET 8) supports C# 10 file-scoped
          # namespaces; mono's bundled msbuild tops out at C# 9.
          # FrameworkPathOverride → mono's net4.8 BCL (mscorlib, System.*)
          # VALHEIM_INSTALL env var is set by the staging step above and is
          # picked up by JotunnLib's Paths.props for its corlib references.
          MONO_LIBS="/usr/lib/mono/4.8-api"
          CI_ROOT="$(pwd)/ci_valheim"
          dotnet msbuild DrakeRenameit.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:FrameworkPathOverride="$MONO_LIBS" \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$CI_ROOT/valheim_Data/Managed" \
            /p:PublicizedAssembliesPath="$CI_ROOT/valheim_Data/Managed/publicized_assemblies" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /t:"Build;ILRepacker" \
            /v:minimal

      # ── Assemble Thunderstore zip (mirrors PackageMod target) ────────────────
      #
      #  PackageMod copies into $(ThunderstoreFolder):
      #    DrakesRenameit.dll  (merged by ILRepack)
      #    README.md
      #    icon.png
      #    CHANGELOG.md
      #    manifest.json       (generated from the ManifestJson ItemGroup)
      #
      #  The manifest.json shape (from the csproj ItemGroup):
      #  {
      #    "name": "DrakesRenameit",
      #    "version_number": "0.9.0",
      #    "author": "DrakeMods",
      #    "description": "...",
      #    "website_url": "https://github.com/drakethos/DrakesRenameIt",
      #    "dependencies": [ "denikson-BepInExPack_Valheim-5.4.2333", "ValheimModding-Jotunn-2.27.1" ]
      #  }
      # ────────────────────────────────────────────────────────────────────────
      - name: Assemble Thunderstore package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakesRenameit-${VERSION}"
          ZIP_NAME="DrakeMods-DrakesRenameit-${VERSION}.zip"

          mkdir -p "$PKG_DIR"

          # The merged DLL ends up in bin/Release/ after ILRepack runs
          cp bin/Release/DrakesRenameit.dll "$PKG_DIR/"
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"

          # Generate manifest.json (same fields as the csproj ManifestJson item)
          python3 - <<'PYEOF'
          import json, os
          manifest = {
              "name": "DrakesRenameit",
              "version_number": os.environ["VERSION"],
              "author": "DrakeMods",
              "description": "Rename and change description any item in your inventory. You can even recolor them too! This is an early beta there may be bugs!",
              "website_url": "https://github.com/drakethos/DrakesRenameIt",
              "dependencies": [
                  "denikson-BepInExPack_Valheim-5.4.2333",
                  "ValheimModding-Jotunn-2.27.1"
              ]
          }
          pkg_dir = os.environ["PKG_DIR"]
          with open(f"{pkg_dir}/manifest.json", "w") as f:
              json.dump(manifest, f, indent=4)
          print("manifest.json written")
          PYEOF

          cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Thunderstore zip: $ZIP_NAME"
          ls -lh "$ZIP_NAME"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PKG_DIR: DrakeMods-DrakesRenameit-${{ steps.ver.outputs.version }}

      # ── Create GitHub Release and attach the zip ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesRenameIt ${{ steps.ver.outputs.version }}"
          prerelease: true
          body: |
            ## DrakesRenameIt v${{ steps.ver.outputs.version }}

            Pre-release build for testing before Thunderstore publish.

            ### Install
            Drop the zip into **r2modman** or **Thunderstore Mod Manager** via the "Import local mod" button, or manually extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesRenameit/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}
